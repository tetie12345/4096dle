<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wordle Clone</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <header>
    <h1>WORDLE</h1>
    <div class="subtitle" id="subtitle">Guess the word(s) in 6 tries</div>
  </header>

  <div id="modeSelect" class="mode-select">
    <h2>Choose mode</h2>
    <div class="mode-buttons">
      <button class="mode-btn" data-mode="1">1 Word</button>
      <button class="mode-btn" data-mode="4">4 Words</button>
    </div>
  </div>

  <div id="game" class="game hidden">
    <div id="board" class="board"></div>
    <div id="keyboard" class="keyboard"></div>
    <div id="message" class="message"></div>
    <div class="actions">
      <button id="newGame" class="btn">New Game</button>
      <button id="menuBtn" class="btn">Menu</button>
    </div>
  </div>
</div>
<script src="words.js?v=2"></script>
<script src="script.js?v=2"></script>
</body>
</html>
