<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wordle Clone</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <header>
    <h1>WORDLE</h1>
    <div class="subtitle" id="subtitle">Guess the word(s) in 6 tries</div>
  </header>

  <div id="modeSelect" class="mode-select">
    <h2>Choose number of words</h2>
    <div class="mode-presets">
      <button class="mode-btn" data-mode="1">1</button>
      <button class="mode-btn" data-mode="2">2</button>
      <button class="mode-btn" data-mode="4">4</button>
      <button class="mode-btn" data-mode="8">8</button>
      <button class="mode-btn" data-mode="16">16</button>
    </div>
    <div class="mode-custom">
      <input type="number" id="modeInput" min="1" max="256" value="4" />
      <button id="modeStart" class="mode-btn">Start</button>
    </div>
    <div class="mode-hint">Guesses scale: words + 5</div>
  </div>

  <div id="game" class="game hidden">
    <div id="board" class="board"></div>
    <div class="hint">Click a board to view its keyboard colors</div>
    <div id="keyboard" class="keyboard"></div>
    <div id="message" class="message"></div>
    <div class="actions">
      <button id="newGame" class="btn">New Game</button>
      <button id="menuBtn" class="btn">Menu</button>
      <button id="toggleKb" class="btn">Hide KB</button>
    </div>
  </div>
</div>
<script src="words.js?v=3"></script>
<script src="script.js?v=3"></script>
</body>
</html>
