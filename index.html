<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4096dle</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <header>
    <h1>4096DLE</h1>
    <div class="subtitle" id="subtitle">Guess the word(s) in 6 tries</div>
    <div class="github-link">
      <a href="https://github.com/tetie12345/4096dle" target="_blank" rel="noopener noreferrer" aria-label="GitHub repository">
        <svg class="github-icon" viewBox="0 0 16 16" width="24" height="24" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        <span class="github-text">Found a bug or have an idea? Report it on GitHub!</span>
      </a>
    </div>
  </header>

  <div id="modeSelect" class="mode-select">
    <h2>Choose number of words</h2>
    <div class="mode-presets">
      <button class="mode-btn" data-mode="1">1</button>
      <button class="mode-btn" data-mode="2">2</button>
      <button class="mode-btn" data-mode="4">4</button>
      <button class="mode-btn" data-mode="8">8</button>
      <button class="mode-btn" data-mode="16">16</button>
      <button class="mode-btn" data-mode="32">32</button>
      <button class="mode-btn" data-mode="64">64</button>
      <button class="mode-btn" data-mode="128">128</button>
      <button class="mode-btn" data-mode="256">256</button>
      <button class="mode-btn" data-mode="512">512</button>
      <button class="mode-btn" data-mode="1024">1024</button>
      <button class="mode-btn" data-mode="2048">2048</button>
      <button class="mode-btn" data-mode="4096">4096</button>
    </div>
    <div class="mode-custom">
      <input type="number" id="modeInput" min="1" max="4096" value="4" />
      <button id="modeStart" class="mode-btn">Start</button>
    </div>
    <div class="mode-hint">Guesses scale: words + 5 to 20 (linear)</div>
  </div>

  <div id="game" class="game hidden">
    <div id="board" class="board"></div>
    <div class="status" id="status"></div>
    <div class="hint">Click a board to view its keyboard colors</div>
    <div id="keyboard" class="keyboard"></div>
  <div class="games-left" id="gamesLeft">Games left: 0</div>
    <div id="message" class="message"></div>
    <div class="actions">
      <button id="newGame" class="btn">New Game</button>
      <button id="menuBtn" class="btn">Menu</button>
      <button id="toggleKb" class="btn">Hide KB</button>
    </div>
  </div>
</div>
<div class="board-label-float" id="boardLabelFloat">Board 1</div>
<div class="minimap" id="minimap"></div>
<button class="minimap-toggle" id="minimapToggle">Hide Map</button>
<script src="words.js"></script>
<script src="script.js"></script>
</body>
</html>
